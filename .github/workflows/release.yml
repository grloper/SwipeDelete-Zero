name: Build & Release APK

# Produces a directly-installable Android APK and attaches it to a GitHub Release.
#
#  • Push a tag like `v1.0.0`  -> a permanent, versioned release.
#  • Push to the dev branch or run manually -> a rolling "latest" pre-release
#    whose APK is overwritten each time, so there is always a fresh build to
#    sideload from the Releases page.
#
# The APK is the F-Droid *debug* variant: it is signed with the standard Android
# debug key, so it installs on any device with "unknown sources" enabled — no
# signing secrets required. For Play-store-grade signing, add a keystore secret
# and switch to `assembleFdroidRelease` (see README).

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APKs (fdroid + cloud)
        run: ./gradlew :app:assembleFdroidDebug :app:assembleCloudDebug --no-daemon --stacktrace

      - name: Stage APK artifacts
        id: stage
        run: |
          set -euo pipefail
          FDROID=$(find app/build/outputs/apk/fdroid/debug -name '*.apk' | head -n1)
          CLOUD=$(find app/build/outputs/apk/cloud/debug -name '*.apk' | head -n1)
          test -n "$FDROID" && test -n "$CLOUD"
          mkdir -p dist
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          cp "$FDROID" "dist/SwipeDeleteZero-${VERSION}-fdroid-debug.apk"
          cp "$CLOUD" "dist/SwipeDeleteZero-${VERSION}-cloud-drive-debug.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload APKs as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: swipedelete-zero-apk
          path: dist/*.apk

      - name: Determine release metadata
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=SwipeDelete Zero ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=rolling" >> "$GITHUB_OUTPUT"
            echo "name=SwipeDelete Zero — rolling build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: dist/*.apk
          fail_on_unmatched_files: true
          body: |
            **SwipeDelete Zero v${{ steps.stage.outputs.version }}** — Android storage cleaner.

            ### 📲 Pick your APK
            - **`fdroid`** — 100% offline, **zero network permissions**. The air-gap build.
            - **`cloud-drive`** — same app **plus opt-in Google Drive backup** of kept & starred
              files (the only build with the INTERNET permission). Requires a one-time OAuth
              setup — see [docs/DRIVE_BACKUP_SETUP.md](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/DRIVE_BACKUP_SETUP.md).

            ### Install
            1. Download an `.apk` below on your Android device.
            2. Open it and allow installing from unknown sources if prompted.
            3. Grant media access on first launch.

            > Debug-signed with the repo's committed debug keystore (directly installable).
            > Built from commit `${{ github.sha }}`.

      # The rolling pre-release is meant to hold exactly one build: the latest.
      # Because asset filenames carry the version, a new build never overwrites
      # the old one — it just piles up alongside it, so the page grows an
      # ever-longer list of stale APKs and it stops being obvious which one to
      # install. Drop everything that is not the version we just published.
      # Permanent v* releases are untouched; they keep their own asset copies.
      - name: Prune stale rolling assets
        if: steps.meta.outputs.tag == 'rolling'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          set -euo pipefail
          api="repos/${{ github.repository }}/releases"
          release_id=$(gh api "$api/tags/rolling" --jq '.id')
          gh api "$api/$release_id/assets" --paginate > /tmp/rolling-assets.json
          # `contains` (not a regex) — version strings have dots in them.
          jq -r --arg v "$VERSION" \
            '.[] | select(.name | contains("-" + $v + "-") | not) | "\(.id)\t\(.name)"' \
            /tmp/rolling-assets.json > /tmp/stale.tsv
          if [ ! -s /tmp/stale.tsv ]; then
            echo "No stale assets on the rolling release."
            exit 0
          fi
          while IFS=$'\t' read -r id name; do
            echo "Removing stale asset: $name"
            gh api -X DELETE "$api/assets/$id"
          done < /tmp/stale.tsv
