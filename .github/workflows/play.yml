name: Play release bundle

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Test both flavors and assemble Play debug
        run: |
          ./gradlew :app:testPlayDebugUnitTest :app:testFdroidDebugUnitTest :app:assemblePlayDebug --no-daemon
      - name: Validate Play release bundle
        run: ./gradlew :app:bundlePlayRelease --no-daemon
      - name: Audit test XML and package evidence archive
        run: |
          mkdir -p evidence/apk
          cp app/build/outputs/apk/play/debug/*.apk evidence/apk/app-play-debug.apk
          mkdir -p evidence/test-results/play evidence/test-results/fdroid
          cp app/build/test-results/testPlayDebugUnitTest/*.xml evidence/test-results/play/
          cp app/build/test-results/testFdroidDebugUnitTest/*.xml evidence/test-results/fdroid/
          python tools/audit_junit.py evidence/test-results --skip-policy tools/expected_skips.json --output evidence/junit_audit.json
          python scripts/package_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: play-debug-apk
          path: app/build/outputs/apk/play/debug/*.apk
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-archive
          path: evidence.zip
          retention-days: 7
          if-no-files-found: error

  bundle:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Build signed Play bundle
        env:
          KEYSTORE_BASE64: ${{ secrets.SDZ_UPLOAD_KEYSTORE_BASE64 }}
          SDZ_UPLOAD_STORE_PASSWORD: ${{ secrets.SDZ_UPLOAD_STORE_PASSWORD }}
          SDZ_UPLOAD_KEY_ALIAS: ${{ secrets.SDZ_UPLOAD_KEY_ALIAS }}
          SDZ_UPLOAD_KEY_PASSWORD: ${{ secrets.SDZ_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$SDZ_UPLOAD_STORE_PASSWORD" && test -n "$SDZ_UPLOAD_KEY_ALIAS" && test -n "$SDZ_UPLOAD_KEY_PASSWORD"
          export SDZ_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SDZ_UPLOAD_KEYSTORE"
          ./gradlew :app:bundlePlayRelease --no-daemon
          rm -f "$SDZ_UPLOAD_KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: play-release-aab
          path: app/build/outputs/bundle/playRelease/*.aab
          retention-days: 7
