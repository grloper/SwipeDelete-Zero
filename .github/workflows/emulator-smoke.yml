name: Android emulator smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :app:assemblePlayDebug --no-daemon
            adb install -r app/build/outputs/apk/play/debug/app-play-debug.apk
            adb shell am start -W -n com.swipedelete.zero.debug/com.swipedelete.zero.MainActivity
            sleep 5
            adb shell pidof com.swipedelete.zero.debug
            mkdir -p smoke
            adb exec-out screencap -p > smoke/dashboard.png
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml smoke/window.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: smoke/
          retention-days: 7
