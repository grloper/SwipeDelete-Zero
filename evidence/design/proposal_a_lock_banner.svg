  <path d="M47 138 V133 C47 130.2 49.2 128 52 128 C54.8 128 57 130.2 57 133 V138 H59 C60.1 138 61 138.9 61 140 V148 C61 149.1 60.1 150 59 150 H45 C43.9 150 43 149.1 43 148 V140 C43 138.9 43.9 138 45 138 Z M49 138 H55 V133 C55 131.3 53.7 130 52 130 C50.3 130 49 131.3 49 133 Z" fill="#F4CE78" />

