<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 892" width="412" height="892">
  <title>SwipeRise — Proposal C: Drawer Badge &amp; Status Chip</title>
  <desc>PROPOSED DESIGN INPUT — NOT RUNNING UI. Shows persistent navigation badge and non-destructive status chip in Staging Drawer.</desc>

  <rect width="412" height="892" fill="#0B0F17" />

  <!-- Top Status Bar & Review Watermark -->
  <rect x="0" y="0" width="412" height="32" fill="#161B26" />
  <text x="206" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#00F2FE" text-anchor="middle">
    PROPOSAL C — DRAWER BADGE &amp; STATUS CHIP (DESIGN ONLY)
  </text>

  <!-- Navigation Drawer Header -->
  <rect x="0" y="32" width="320" height="860" fill="#111622" stroke="#2B3245" stroke-width="1.5" />

  <text x="24" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">SwipeRise</text>
  <text x="24" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#00F2FE">Safety &amp; Privacy First</text>

  <!-- Drawer Menu Items -->
  <!-- 1. Review Deck (Active) -->
  <rect x="16" y="128" width="288" height="48" rx="10" fill="#161B26" />
  <text x="36" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">🃏 Review Deck</text>

  <!-- 2. Staged Cleanup Queue with Safety Lock Badge -->
  <rect x="16" y="186" width="288" height="56" rx="10" fill="#1C1810" stroke="#F4CE78" stroke-width="1" />
  <text x="36" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#F4CE78">🗑 Staging Drawer</text>
  <text x="36" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#E1E6EB">3 files staged • Deletion Locked</text>
  <rect x="238" y="198" width="56" height="24" rx="6" fill="#F4CE78" />
  <text x="266" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#111622" text-anchor="middle">LOCKED</text>

  <!-- 3. Cloud Backups Status -->
  <rect x="16" y="252" width="288" height="48" rx="10" fill="#161B26" />
  <text x="36" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">☁ Cloud Archive</text>
  <rect x="220" y="264" width="74" height="24" rx="6" fill="#112A26" />
  <text x="257" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#4EEDA6" text-anchor="middle">CONNECTED</text>

  <!-- 4. Settings -->
  <rect x="16" y="310" width="288" height="48" rx="10" fill="#161B26" />
  <text x="36" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">⚙ Settings</text>

  <!-- Focus Detail: Status Chip Callout -->
  <rect x="16" y="400" width="288" height="190" rx="12" fill="#161B26" stroke="#2B3245" stroke-width="1" />
  <text x="28" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00F2FE">Persistent Status Chip</text>
  <text x="28" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#8B949E">Displayed on every staged card:</text>

  <!-- Chip Preview -->
  <rect x="28" y="462" width="264" height="32" rx="8" fill="#112A26" stroke="#4EEDA6" stroke-width="1" />
  <text x="160" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4EEDA6" text-anchor="middle">
    ☁ Backed up to Google Photos · Originals stay on device
  </text>

  <text x="28" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#E1E6EB">
    Guarantees user understands their device file
  </text>
  <text x="28" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#E1E6EB">
    will NOT be deleted when backing up.
  </text>

  <!-- Footer Info in Drawer -->
  <text x="24" y="840" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#6E7687">
    SwipeRise v1.0.0-m0 • Build PlayDebug
  </text>
</svg>
