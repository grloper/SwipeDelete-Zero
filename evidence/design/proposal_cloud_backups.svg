<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 892" width="412" height="892">
  <title>SwipeDelete Zero — Proposed M2 Cloud Backups &amp; Recovery (Token Spec v1.0)</title>
  <desc>PROPOSED DESIGN INPUT — NOT IMPLEMENTED UI. Shows explicit account binding, resumable session state, honest Google Photos vs Drive Originals Vault separation, and independent restore entry point.</desc>

  <!-- Canvas Background (#101418) -->
  <rect width="412" height="892" fill="#101418" />

  <!-- Watermark Header Banner -->
  <rect x="0" y="0" width="412" height="28" fill="#352D18" />
  <text x="206" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#F4CE78" text-anchor="middle">
    PROPOSED DESIGN (M2 SPEC) — NOT IMPLEMENTED UI — SYNTHETIC FIXTURE
  </text>

  <!-- Top Bar (48dp interactive hit target) -->
  <rect x="20" y="40" width="48" height="48" rx="12" fill="#191F25" stroke="#46515D" stroke-width="1.5" />
  <path d="M48 56 L40 64 L48 72" stroke="#F5F7FA" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <text x="80" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#F5F7FA">Cloud Backups &amp; Vault</text>

  <!-- Account Binding Card (rx=20 card token) -->
  <rect x="20" y="104" width="372" height="108" rx="20" fill="#191F25" stroke="#46515D" stroke-width="1.5" />
  <circle cx="52" cy="144" r="18" fill="#163B30" stroke="#7DE6C1" stroke-width="1.5" />
  <text x="52" y="149" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#7DE6C1" text-anchor="middle">QA</text>
  <text x="82" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#F5F7FA">fixture-test-account@example.org</text>
  <text x="82" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#B5C1CD">Bound to active session • Scopes: appendonly + read</text>
  <rect x="36" y="172" width="340" height="28" rx="6" fill="#242C35" />
  <text x="206" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#7DE6C1" text-anchor="middle">✓ Account-rotation guard active (NET-02)</text>

  <!-- Provider Capability Disclosure Card -->
  <rect x="20" y="228" width="372" height="116" rx="20" fill="#242C35" stroke="#46515D" stroke-width="1.5" />
  <text x="36" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Destination Capabilities &amp; Proof Status</text>
  <text x="36" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#F4CE78">• Google Photos Copy: Secondary convenience gallery</text>
  <text x="48" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#B5C1CD">(Metadata/URL check only — does not unlock local deletion)</text>
  <text x="36" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#7DE6C1">• Originals Vault (M1): Byte-verified SHA-256 restore proof</text>
  <text x="48" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#B5C1CD">(Required before any local file can be removed)</text>

  <!-- Resumable Transfer Queue Section -->
  <text x="20" y="374" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#F5F7FA">Active &amp; Recent Transfers</text>

  <!-- Item 1: Resumable Chunk Progress -->
  <rect x="20" y="388" width="372" height="100" rx="12" fill="#191F25" stroke="#46515D" stroke-width="1" />
  <text x="36" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">VID_SYNTHETIC_4K_CLIP.mp4</text>
  <text x="36" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#B5C1CD">16.0 MB / 24.0 MB • Resumable 8 MiB chunking</text>
  <!-- Progress track -->
  <rect x="36" y="446" width="276" height="8" rx="4" fill="#242C35" />
  <rect x="36" y="446" width="184" height="8" rx="4" fill="#7DE6C1" />
  <text x="36" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7DE6C1">⏳ UPLOADING (Chunk 2 of 3 Acked)</text>
  <!-- Cancel button (48x48dp hit target) -->
  <rect x="328" y="414" width="48" height="48" rx="12" fill="#242C35" stroke="#46515D" stroke-width="1" />
  <text x="352" y="443" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#FFB4AB" text-anchor="middle">✕</text>

  <!-- Item 2: Session Recovery / Lost Finalization Handled -->
  <rect x="20" y="500" width="372" height="92" rx="12" fill="#191F25" stroke="#46515D" stroke-width="1" />
  <text x="36" y="526" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">IMG_SYNTHETIC_PANORAMA.jpg</text>
  <text x="36" y="546" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#B5C1CD">6.4 MB • Photos MediaItem Verified (READY)</text>
  <rect x="36" y="556" width="220" height="24" rx="6" fill="#163B30" stroke="#7DE6C1" stroke-width="1" />
  <text x="146" y="572" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#7DE6C1" text-anchor="middle">✓ Photos Copy Ready (Metadata Only)</text>

  <!-- Item 3: Terminal Failure with Explicit Retry -->
  <rect x="20" y="604" width="372" height="96" rx="12" fill="#191F25" stroke="#FFB4AB" stroke-width="1" />
  <text x="36" y="630" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">RAW_SYNTHETIC_BURST_09.dng</text>
  <text x="36" y="650" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#FFB4AB">■ FAILED (HTTP 429 Rate Limit — Backoff Exhausted)</text>
  <text x="36" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#B5C1CD">Local original untouched • Attempt 5/5</text>
  <rect x="312" y="628" width="64" height="48" rx="12" fill="#242C35" stroke="#7DE6C1" stroke-width="1.5" />
  <text x="344" y="657" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#7DE6C1" text-anchor="middle">Retry</text>

  <!-- Primary Action: Browse & Restore Originals (52dp height, #7DE6C1) -->
  <rect x="20" y="728" width="372" height="52" rx="12" fill="#7DE6C1" />
  <text x="206" y="760" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#0B241A" text-anchor="middle">Browse &amp; Restore From Vault (M1)</text>

  <!-- Secondary Action: Open in Google Photos -->
  <rect x="20" y="792" width="372" height="52" rx="12" fill="#242C35" stroke="#46515D" stroke-width="1.5" />
  <text x="206" y="824" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#F5F7FA" text-anchor="middle">Open Google Photos App</text>
</svg>
